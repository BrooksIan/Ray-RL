# --- Identity ---
name: "Ray RLlib on Cloudera AI"
slug: "ray-rllib-on-cloudera-ai"
description: "Multi-project Ray RLlib labs on Cloudera AI — Taxi/PPO cover demo, plus CartPole/DQN, Pendulum/SAC, and multi-agent CartPole."
long_description: >
  Learn distributed reinforcement learning with Ray RLlib on Cloudera AI Workbench.
  The cover demo uses Gymnasium Taxi with PPO (pickup-and-delivery, delayed rewards).
  Companion projects add DQN on CartPole (off-policy discrete control), SAC on Pendulum
  (continuous actuators), and multi-agent PPO on MultiAgentCartPole (fleet controllers).
  Includes script entrypoints, a Taxi notebook, an RL primer, and Workbench deploy notes.
