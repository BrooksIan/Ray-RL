# --- Identity ---
name: "Ray RLlib on Cloudera AI"
slug: "ray-rllib-on-cloudera-ai"
description: "Multi-project Ray RLlib labs on Cloudera AI — Taxi/PPO cover through offline→online fine-tune."
long_description: >
  Learn distributed reinforcement learning with Ray RLlib on Cloudera AI Workbench.
  The cover demo uses Gymnasium Taxi with PPO (pickup-and-delivery, delayed rewards).
  Companion projects add DQN, SAC, multi-agent PPO, offline BC, a custom TicketQueue
  playground, and offline→online fine-tune (BC warm-start then PPO).
  Includes script entrypoints, Jupyter notebooks for every project, optional MLflow
  episode-return tracking, multi-worker Workbench sizing notes, an RL primer, and
  deploy guidance.
reprise_link: "" # Optional: public Reprise / recorded walkthrough URL
